name = "agent-portal-worker"
main = "worker.js"
compatibility_date = "2026-11-05"

# D1 database for the Agent Portal (shared board, claims, outcomes).
# The database_id below is a placeholder for local testing only.
# At deploy time, replace it with the real id from `wrangler d1 create`
# (see README.md). The Worker is NOT deployed yet — going live is the
# owner's tap.
[[d1_databases]]
binding = "DB"
database_name = "agent-portal"
database_id = "00000000-0000-0000-0000-000000000000"
